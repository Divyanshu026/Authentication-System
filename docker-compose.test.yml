services:
  test-runner:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=postgres://admin:admin123@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_for_testing
      - PORT=3000
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -lc "npm ci && npm test"