services:
  test-runner:
    build:
      context: .
      target: builder 
    environment:
      - DATABASE_URL=postgres://admin:admin123@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_for_testing
      - PORT=3000
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app               # Syncs your live VS Code files directly into the container
      - /app/node_modules    # Protects the container's native Linux modules from being overwritten
    command: npm test