services:
  test-runner:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -lc "npm ci && npm test"